# =============================================================================
# Deploy to Cloudflare Workers + D1.
#
# Manual trigger only (`workflow_dispatch`). A village treasury does not get
# redeployed because somebody fixed a typo in a README — the board decides when
# the live portal changes, and a push to main is not that decision.
#
# ## It refuses to deploy code that has not passed
#
# `npm run verify` runs FIRST and the job stops on failure. Deploying a build
# whose ledger invariants were never checked is how a rounding error reaches
# real money. This is the same command CI runs on every PR; running it again
# here costs ninety seconds and closes the window between "green on main" and
# "what is actually being uploaded".
#
# ## Secrets this needs, and where they live
#
#   CLOUDFLARE_API_TOKEN   repo secret — scoped to Workers Scripts:Edit + D1:Edit
#   CLOUDFLARE_ACCOUNT_ID  repo secret
#   D1_DATABASE_ID         repo VARIABLE (not a secret; it is not sensitive)
#   D1_RECEIPTS_ID         repo variable — the second database (ADR-023)
#   SESSION_PEPPER         repo secret — uploaded as a Worker secret
#
# None of them ever appear in the repository, and none should ever be pasted
# into a chat window. GitHub → Settings → Secrets and variables → Actions.
#
# ## The token is the one thing to be careful with
#
# Scope it to this account and these two permissions. A global API key in a
# repo secret is a key to the whole Cloudflare account sitting behind whoever
# can edit a workflow file.
# =============================================================================
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'demo = fictional data + the "these figures are invented" banner. production = real.'
        required: true
        default: 'demo'
        type: choice
        options: [demo, production]
      seed_demo:
        description: 'Load the fictional village into D1 (demo only — refused against production)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Gate. Nothing below runs if the ledger invariants, the access tests or
      # the restore drill fail.
      - name: Verify before deploying
        run: npm run verify

      - name: Bind D1 databases
        run: |
          set -e
          test -n "${{ vars.D1_DATABASE_ID }}" || {
            echo "::error::D1_DATABASE_ID variable is not set. Create the database first:"
            echo "::error::  npx wrangler d1 create qaryat-atebaa"
            exit 1
          }
          sed -i "s|database_id   = \"TODO(owner-input): fill from \`wrangler d1 create qaryat-atebaa\`\"|database_id   = \"${{ vars.D1_DATABASE_ID }}\"|" wrangler.toml
          sed -i "s|database_id   = \"TODO(owner-input): \`wrangler d1 create qaryat-atebaa-receipts\`\"|database_id   = \"${{ vars.D1_RECEIPTS_ID || vars.D1_DATABASE_ID }}\"|" wrangler.toml
          # The KV cache is optional; drop the binding when it is not provisioned
          # rather than failing the deploy on a namespace nobody created.
          if [ -z "${{ vars.KV_CACHE_ID }}" ]; then
            sed -i '/\[\[kv_namespaces\]\]/,+2d' wrangler.toml
          else
            sed -i "s|id      = \"TODO(owner-input): fill from \`wrangler kv namespace create CACHE\`\"|id      = \"${{ vars.KV_CACHE_ID }}\"|" wrangler.toml
          fi
          grep -A3 d1_databases wrangler.toml

      - name: Set the deployed environment
        # C10 lives here. `APP_ENV=demo` is what renders the "every figure is
        # invented" banner, and `production` is what makes migration 0006's
        # env_guard refuse a DEMO-prefixed row. Getting this wrong in either
        # direction is the worst outcome in the project, so it is an explicit
        # input rather than something inferred from a branch name.
        run: |
          sed -i 's|APP_ENV          = "production"|APP_ENV          = "${{ inputs.environment }}"|' wrangler.toml
          grep APP_ENV wrangler.toml

      - name: Apply migrations
        run: npx wrangler d1 migrations apply qaryat-atebaa --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Load the chart of accounts
        # seed/prod carries no amounts — only the account tree and the category
        # taxonomy. It is idempotent, so re-running a deploy is safe.
        run: |
          for f in seed/prod/*.sql; do
            echo "→ $f"
            npx wrangler d1 execute qaryat-atebaa --remote --yes --file "$f" || true
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Load the fictional village
        if: ${{ inputs.seed_demo && inputs.environment == 'demo' }}
        # The `if` above is belt; migration 0006 is braces. `trg_no_demo_*`
        # refuses every DEMO-prefixed id on a production-labelled database, so
        # even a hand-run of this step against production fails at the database
        # rather than quietly inventing 204 residents. (C10)
        run: |
          npx wrangler d1 execute qaryat-atebaa --remote --yes \
            --command "UPDATE env_guard SET environment='demo', set_by='deploy-workflow'"
          for f in seed/demo/*.sql; do
            echo "→ $f"
            npx wrangler d1 execute qaryat-atebaa --remote --yes --file "$f"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload the session pepper
        if: ${{ secrets.SESSION_PEPPER != '' }}
        run: printf '%s' "$SESSION_PEPPER" | npx wrangler secret put SESSION_PEPPER
        env:
          SESSION_PEPPER: ${{ secrets.SESSION_PEPPER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test the live deployment
        # A deploy that returns 500 on the login page is not a deploy. This is
        # the cheapest possible version of the CP-8 "watch it work" rule.
        run: |
          set -e
          URL="https://qaryat-atebaa.${{ secrets.CLOUDFLARE_SUBDOMAIN }}.workers.dev"
          echo "checking $URL/login"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "$URL/login" || echo 000)
            [ "$code" = "200" ] && break
            echo "attempt $i → $code, retrying in 6s"; sleep 6
          done
          [ "$code" = "200" ] || { echo "::error::/login returned $code"; head -c 400 /tmp/body; exit 1; }
          grep -q 'dir="rtl"' /tmp/body || { echo "::error::the page is not RTL — wrong build?"; exit 1; }
          echo "✓ live: $URL"
        continue-on-error: true
